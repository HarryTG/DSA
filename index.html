<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#c9f6eb">
  <title>Dunedin School of Art</title>
  <script>document.documentElement.classList.add('js-enabled');</script>
  <style>
    :root { color-scheme: light; background: #c9f6eb; --fade-duration: 40ms; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100vh; min-height: 100svh; overflow: hidden; background: #c9f6eb; cursor: default; }
    #scene { position: relative; display: flex; justify-content: center; align-items: flex-start; width: 100%; min-height: 100vh; min-height: 100svh; }
    .DSA-logo { display: block; flex: none; width: clamp(240px, 32vw, 320px); height: auto; overflow: visible; }
    .logo-text { z-index: 9; }
    .js-enabled .logo-dot:not(.is-visible) { display: none; }
    .logo-dot, .extra-dot { transition: opacity var(--fade-duration) ease; cursor: default; outline: none; }
    .logo-dot:focus, .logo-dot:focus-visible { outline: none; filter: none; }
    [role="button"] { -webkit-tap-highlight-color: transparent; }
    .extra-dot, .loose-dot { position: absolute; width: var(--dot-diameter); height: var(--dot-diameter); border-radius: 50%; transform: translate(-50%, -50%); cursor: default; outline: none; }
    .extra-dot { pointer-events: auto; }
    .loose-dot { z-index: 3; pointer-events: none; will-change: left, top; }
    .is-disappearing { opacity: 0 !important; pointer-events: none !important; }
    #dot-field { position: fixed; z-index: 2; inset: 0; overflow: hidden; pointer-events: none; }
    [class^="letter-"] { transition: 0.1s ease-in-out; }

  </style>
</head>

  <script>
    (() => {
      // Edit these values to tune the sequence and the falling-dot physics.
      const TIMING = Object.freeze({
        // Time between individual dots and the empty-screen pause.
        DOT_INTERVAL_MS: 1500,
        EMPTY_PAUSE_MS: 8000,
        FADE_DURATION_MS: 40
      });
      const PHYSICS = Object.freeze({
        // Gravity is in pixels per second squared.
        GRAVITY_PX_PER_SECOND_SQUARED: 1000,
        // Velocity multipliers applied once per 60 Hz frame.
        AIR_FRICTION_PER_FRAME: 0.99,
        ROLL_FRICTION_PER_FRAME: 0.96,
        // Fraction of vertical speed kept after hitting the floor.
        BOUNCE: 0.45,
        DOT_COLLISION_BOUNCE: 0.42,
        // Starting sideways speed is this fraction of the viewport width.
        HORIZONTAL_SPEED_SCREEN_RATIO: 0.05,
        MIN_REST_SPEED_PX_PER_SECOND: 8
      });
      const COLOR_PALETTE = [
        '#0f77df', '#c33e3e', '#35a77b', '#f0b429', '#7656c8',
        '#ee7448', '#e76591', '#74a9d8'
      ];
      const DOT_Y = [49.981, 92.756, 135.531, 178.306, 221.081, 263.856];
      const SVG_STEP = 42.775;
      const SVG_DOT_X = 29.8;
      const SVG_DOT_RADIUS = 13.67;

      document.documentElement.style.setProperty('--fade-duration', `${TIMING.FADE_DURATION_MS}ms`);

      const logo = document.getElementById('logo');
      const field = document.getElementById('dot-field');
      const sourceDots = [...logo.querySelectorAll('.logo-dot')]
        .sort((a, b) => Number(a.dataset.dotIndex) - Number(b.dataset.dotIndex));
      const visible = new Set();
      const extraDots = new Map();
      const particles = [];
      let phase = 'black-growing';
      let maxIndex = 5;
      let nextIndex = 1;
      let timer = 0;
      let animationFrame = 0;
      let lastFrameTime = 0;
      let lastGeneratedColor = null;
      let generatedColorCount = 0;
      let hasNotClicked = true;

      function metrics() {
        const rect = logo.getBoundingClientRect();
        const scale = rect.width / 320;
        const step = SVG_STEP * scale;
        const radius = SVG_DOT_RADIUS * scale;
        const firstY = rect.top + DOT_Y[0] * scale;
        return {
          scale,
          step,
          radius,
          firstY,
          centerX: rect.left + SVG_DOT_X * scale,
          max: Math.max(5, Math.floor((window.innerHeight - radius - firstY) / step))
        };
      }

      function dotCenter(index) {
        const m = metrics();
        const y = index < DOT_Y.length
          ? DOT_Y[index]
          : DOT_Y[0] + index * SVG_STEP;
        return {
          x: m.centerX,
          y: logo.getBoundingClientRect().top + y * m.scale,
          radius: SVG_DOT_RADIUS * m.scale
        };
      }

      function liveColoredCount() {
        return visible.size + particles.length;
      }

      function isOccupied(index) {
        return visible.has(index) || particles.some(particle => particle.index === index);
      }

      function nextAvailableIndex() {
        for (let index = 0; index <= maxIndex; index += 1) {
          if (!isOccupied(index)) return index;
        }
        return maxIndex + 1;
      }

      function schedule(callback, delay = TIMING.DOT_INTERVAL_MS) {
        clearTimeout(timer);
        timer = window.setTimeout(() => {
          timer = 0;
          callback();
        }, delay);
      }

      function getDotNode(index) {
        return index < sourceDots.length ? sourceDots[index] : extraDots.get(index);
      }

      function positionExtra(index, node) {
        const center = dotCenter(index);
        node.style.setProperty('--dot-diameter', `${center.radius * 2}px`);
        node.style.left = `${center.x}px`;
        node.style.top = `${center.y}px`;
      }

      function showDot(index, color = '#404040') {
        if (visible.has(index)) return;
        visible.add(index);
        if (index < sourceDots.length) {
          const node = sourceDots[index];
          node.style.fill = color;
          node.classList.remove('is-disappearing');
          node.classList.add('is-visible');
          node.tabIndex = 0;
          node.setAttribute('role', 'button');
          node.setAttribute('aria-label', `Dot ${index + 1}`);
          return;
        }
        let node = extraDots.get(index);
        if (!node) {
          node = document.createElement('span');
          node.className = 'extra-dot';
          node.dataset.dotIndex = String(index);
          node.setAttribute('role', 'button');
          node.setAttribute('aria-label', `Dot ${index + 1}`);
          node.tabIndex = 0;
          extraDots.set(index, node);
          field.append(node);
          positionExtra(index, node);
        }
        node.style.backgroundColor = color;
        node.classList.remove('is-disappearing');
      }

      function fadeOutDot(index) {
        if (!visible.has(index)) return;
        const node = getDotNode(index);
        if (!node) return;
        visible.delete(index);
        node.classList.remove('is-visible');
        node.classList.add('is-disappearing');
        if (index < sourceDots.length) {
          node.tabIndex = -1;
          node.removeAttribute('role');
          node.removeAttribute('aria-label');
        } else {
          node.tabIndex = -1;
          node.removeAttribute('role');
          node.removeAttribute('aria-label');
        }
        window.setTimeout(() => {
          if (index >= sourceDots.length && !visible.has(index) && extraDots.get(index) === node) {
            node.remove();
            extraDots.delete(index);
          } else if (index < sourceDots.length && !visible.has(index)) {
            node.classList.remove('is-disappearing');
          }
        }, TIMING.FADE_DURATION_MS);
      }

      function blackDotClicked(index) {
        if (!visible.has(index)) return;
        const wasShrinking = phase === 'black-shrinking';
        fadeOutDot(index);
        if (phase === 'black-shrinking') phase = 'black-stopped';
        if (visible.size === 0) beginBlackClear();
      }

      function beginBlackClear() {
        if (phase === 'empty-wait' || phase.startsWith('color-')) return;
        clearTimeout(timer);
        timer = 0;
        // for (const index of [...visible]) fadeOutDot(index);
        schedule(() => {
          phase = 'empty-wait';
          schedule(startColorPhase, TIMING.EMPTY_PAUSE_MS);
        }, TIMING.FADE_DURATION_MS);
      }

      function blackGrowStep() {
        if (phase !== 'black-growing') return;
        maxIndex = metrics().max;
        if (nextIndex <= maxIndex) {
          showDot(nextIndex, '#404040');
          nextIndex += 1;
          schedule(blackGrowStep);
        } else if (hasNotClicked) {
          phase = 'black-shrinking';
          schedule(blackShrinkStep, TIMING.EMPTY_PAUSE_MS);
        }
      }

      function blackShrinkStep() {
        if (phase !== 'black-shrinking') return;
        const indices = [...visible].sort((a, b) => b - a);
        if (indices.length === 0) {
          beginBlackClear();
          return;
        }
        fadeOutDot(indices[0]);
        if (visible.size === 0) beginBlackClear();
        else schedule(blackShrinkStep);
      }

      function nextColor() {
        let color;
        if (generatedColorCount < 6) {
          color = COLOR_PALETTE[generatedColorCount];
        } else {
          const choices = COLOR_PALETTE.filter(candidate => candidate !== lastGeneratedColor);
          color = choices[Math.floor(Math.random() * choices.length)];
        }
        generatedColorCount += 1;
        lastGeneratedColor = color;
        return color;
      }

      function startColorPhase() {
        phase = 'color-growing';
        maxIndex = metrics().max;
        generatedColorCount = 0;
        showDot(0, nextColor());
        nextIndex = 1;
        schedule(colorGrowStep);
      }

      function startColorGrowth() {
        clearTimeout(timer);
        timer = 0;
        phase = 'color-growing';
        maxIndex = metrics().max;
        nextIndex = nextAvailableIndex();
        schedule(colorGrowStep);
      }

      function colorGrowStep() {
        if (phase !== 'color-growing') return;
        maxIndex = metrics().max;
        while (nextIndex <= maxIndex && isOccupied(nextIndex)) nextIndex += 1;
        if (nextIndex <= maxIndex) {
          showDot(nextIndex, nextColor());
          nextIndex += 1;
          schedule(colorGrowStep);
        } else if (hasNotClicked) {
          generatedColorCount = 0;
          phase = 'color-shrinking';
          schedule(colorShrinkStep, TIMING.EMPTY_PAUSE_MS);
        } else { generatedColorCount = 0; }
      }

      function colorShrinkStep() {
        if (phase !== 'color-shrinking') return;
        if (liveColoredCount() === 6 && hasNotClicked) return;
        if (liveColoredCount() === 6) return;
        if (liveColoredCount() <= 0) {
          startColorGrowth();
          return;
        }
        const indices = [...visible].sort((a, b) => b - a);
        if (indices.length) fadeOutDot(indices[0], true);
        schedule(colorShrinkStep);
      }

      function activateDot(index) {
        hasNotClicked = false;
        if (!visible.has(index)) return;
        if (phase === 'black-growing' || phase === 'black-shrinking' || phase === 'black-stopped') {
          blackDotClicked(index);
        } else if (phase === 'color-growing' || phase === 'color-shrinking') {
          releaseColoredDot(index);
        }
      }

      function releaseColoredDot(index) {
        const node = getDotNode(index);
        if (!node || !visible.has(index)) return;
        const center = dotCenter(index);
        const color = index < sourceDots.length ? node.style.fill : node.style.backgroundColor;
        visible.delete(index);
        node.classList.remove('is-visible');
        node.classList.add('is-disappearing');
        node.tabIndex = -1;
        node.removeAttribute('role');
        node.removeAttribute('aria-label');
        window.setTimeout(() => {
          if (index >= sourceDots.length && !visible.has(index) && extraDots.get(index) === node) {
            node.remove();
            extraDots.delete(index);
          } else if (index < sourceDots.length && !visible.has(index)) {
            node.classList.remove('is-disappearing');
          }
        }, TIMING.FADE_DURATION_MS);

        const moving = document.createElement('span');
        moving.className = 'loose-dot';
        moving.style.setProperty('--dot-diameter', `${center.radius * 2}px`);
        moving.style.backgroundColor = color;
        moving.style.left = `${center.x}px`;
        moving.style.top = `${center.y}px`;
        moving.setAttribute('aria-hidden', 'true');
        field.append(moving);
        // const direction = center.x < window.innerWidth / 2 ? 1 : -1;
        const xDirection = Math.random() < 0.5 ? 1 : -1;
        // const xSpeed = window.innerWidth * PHYSICS.HORIZONTAL_SPEED_SCREEN_RATIO * (0.65 + Math.random() * 0.7);
        const xSpeed = window.innerWidth * PHYSICS.HORIZONTAL_SPEED_SCREEN_RATIO * (0.65 + Math.random() * 0.7);
        particles.push({
          index,
          x: center.x,
          y: center.y,
          vx: xDirection * xSpeed,
          vy: 0,
          radius: center.radius,
          color,
          element: moving,
          landed: false,
          sleeping: false
        });
        startPhysics();
      }

      function collideWithStationary(moving, stationaryX, stationaryY, stationaryRadius) {
        let dx = moving.x - stationaryX;
        let dy = moving.y - stationaryY;
        let distance = Math.hypot(dx, dy);
        const minimum = moving.radius + stationaryRadius;
        if (distance >= minimum) return;
        if (distance === 0) {
          dx = 1;
          dy = 0;
          distance = 1;
        }
        const nx = dx / distance;
        const ny = dy / distance;
        moving.x = stationaryX + nx * minimum;
        moving.y = stationaryY + ny * minimum;
        const toward = moving.vx * nx + moving.vy * ny;
        if (toward < 0) {
          const impulse = (1 + PHYSICS.DOT_COLLISION_BOUNCE) * toward;
          moving.vx -= impulse * nx;
          moving.vy -= impulse * ny;
          moving.sleeping = false;
        }
      }

      function collideMoving(a, b) {
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let distance = Math.hypot(dx, dy);
        const minimum = a.radius + b.radius;
        if (distance >= minimum) return;
        if (distance === 0) {
          dx = 1;
          dy = 0;
          distance = 1;
        }
        const nx = dx / distance;
        const ny = dy / distance;
        const overlap = minimum - distance;
        a.x -= nx * overlap / 2;
        a.y -= ny * overlap / 2;
        b.x += nx * overlap / 2;
        b.y += ny * overlap / 2;
        const relative = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (relative < 0) {
          const impulse = -(1 + PHYSICS.DOT_COLLISION_BOUNCE) * relative / 2;
          a.vx -= impulse * nx;
          a.vy -= impulse * ny;
          b.vx += impulse * nx;
          b.vy += impulse * ny;
          a.sleeping = false;
          b.sleeping = false;
        }
      }

      function startPhysics() {
        if (animationFrame) return;
        lastFrameTime = performance.now();
        animationFrame = requestAnimationFrame(stepPhysics);
      }

      function stepPhysics(now) {
        const dt = Math.min((now - lastFrameTime) / 1000, 0.032);
        lastFrameTime = now;
        const floorEnabled = liveColoredCount() <= 6;
        for (const moving of particles) {
          if (moving.sleeping) continue;
          moving.vx *= Math.pow(PHYSICS.AIR_FRICTION_PER_FRAME, dt * 60);
          moving.vy += PHYSICS.GRAVITY_PX_PER_SECOND_SQUARED * dt;
          moving.x += moving.vx * dt;
          moving.y += moving.vy * dt;

          for (const index of visible) {
            const stationary = dotCenter(index);
            collideWithStationary(moving, stationary.x, stationary.y, stationary.radius);
          }
        }

        for (let i = 0; i < particles.length; i += 1) {
          for (let j = i + 1; j < particles.length; j += 1) collideMoving(particles[i], particles[j]);
        }

        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const moving = particles[i];
          const floorY = window.innerHeight - moving.radius;
          if (floorEnabled && moving.y >= floorY) {
            moving.y = floorY;
            moving.landed = true;
            if (moving.vy > 0) {
              const rebound = moving.vy * PHYSICS.BOUNCE;
              moving.vy = rebound < PHYSICS.MIN_REST_SPEED_PX_PER_SECOND ? 0 : -rebound;
              moving.landed = false;
            }
          }
          if (moving.landed) {
            moving.vx *= Math.pow(PHYSICS.ROLL_FRICTION_PER_FRAME, dt * 60);
            if (Math.abs(moving.vx) < PHYSICS.MIN_REST_SPEED_PX_PER_SECOND) moving.vx = 0;
            if (Math.abs(moving.vy) < PHYSICS.MIN_REST_SPEED_PX_PER_SECOND) moving.vy = 0;
            if (moving.vx === 0 && moving.vy === 0) moving.sleeping = true;
          }
          if (!floorEnabled && moving.y - moving.radius > window.innerHeight) {
            moving.element.remove();
            particles.splice(i, 1);
            continue;
          }
          moving.element.style.left = `${moving.x}px`;
          moving.element.style.top = `${moving.y}px`;
        }

        const needsFrame = particles.some(moving => !moving.sleeping);
        if (needsFrame) animationFrame = requestAnimationFrame(stepPhysics);
        else animationFrame = 0;
      }

      logo.addEventListener('click', event => {
        const dot = event.target.closest?.('.logo-dot');
        if (dot) activateDot(Number(dot.dataset.dotIndex));
      });
      logo.addEventListener('keydown', event => {
        const dot = event.target.closest?.('.logo-dot');
        if (dot && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          activateDot(Number(dot.dataset.dotIndex));
        }
      });
      field.addEventListener('click', event => {
        const dot = event.target.closest?.('.extra-dot');
        if (dot) activateDot(Number(dot.dataset.dotIndex));
      });
      field.addEventListener('keydown', event => {
        const dot = event.target.closest?.('.extra-dot');
        if (dot && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          activateDot(Number(dot.dataset.dotIndex));
        }
      });

      window.addEventListener('resize', () => {
        maxIndex = metrics().max;
        for (const [index, dot] of extraDots) positionExtra(index, dot);
      }, { passive: true });

      showDot(0, '#404040');
      schedule(blackGrowStep);


      function initKeySpecificLetterOpacity() {
        // Helpers to check if a pressed key is a specific letter
        const isLetterSmall = (key) => /^[duneischolfart]$/.test(key);
        const isLetterBig = (key) => /^[DUNEISCHOLFART]$/.test(key);

        // Helper to find elements whose class starts with "letter-" followed by the specific letter
        const getTargetElements = (letter) => {
          return document.querySelectorAll(
            `[class^="letter-${letter}"], [class*=" letter-${letter}"]`
          );
        };

        // Handle keydown: set opacity to 0 for small letters
        window.addEventListener('keydown', (event) => {
          if (event.repeat) return; // Prevent rapid firing if key is held down
          if (!isLetterSmall(event.key)) return;
          const letter = event.key.toLowerCase();
          getTargetElements(letter).forEach((el) => {
            el.style.opacity = '0';
          });
        });
        // Keydown: set colour for uppercase letters
        window.addEventListener('keydown', (event) => {
          if (event.repeat) return; // Prevent rapid firing if key is held down
          if (!isLetterBig(event.key)) return;
          const letter = event.key.toLowerCase();
          getTargetElements(letter).forEach((el) => {
            el.style.fill = nextColor();
          });
        });

        // Handle keyup: restore opacity back to 1 for small letters
        window.addEventListener('keyup', (event) => {
          if (!isLetterSmall(event.key) && !isLetterBig(event.key)) return;
          const letter = event.key.toLowerCase();
          getTargetElements(letter).forEach((el) => {
            el.style.opacity = '1';
          });
        });
      }
      initKeySpecificLetterOpacity();

    })();
  </script>
</body>
